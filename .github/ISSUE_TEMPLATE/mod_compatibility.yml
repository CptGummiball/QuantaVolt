name: Mod compatibility
description: A block or feature of another mod does not work together with QuantaVolt.
labels: ["compatibility", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        QuantaVolt connects to other mods through the standard interfaces of each loader (Fabric Transfer API and Team Reborn Energy, NeoForge capabilities). Gases only move through Pipster's gas system. See [Energy, Fluids and Gases](https://github.com/CptGummiball/QuantaVolt/wiki/Energy-Fluids-Gases).

        Known limits, no need to report: see the wiki ([Supported Versions](https://github.com/CptGummiball/QuantaVolt/wiki/Supported-Versions), [FAQ](https://github.com/CptGummiball/QuantaVolt/wiki/FAQ)). Mekanism chemicals are not compatible with Pipster's gases.

  - type: input
    id: othermod
    attributes:
      label: Other mod and version
      placeholder: "ExampleMod 2.3.1"
    validations:
      required: true

  - type: input
    id: block
    attributes:
      label: Block or machine
      description: Which block of that mod? (name, and the id if you know it, e.g. from F3)
      placeholder: "Example Furnace (examplemod:furnace)"
    validations:
      required: true

  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "1.21.1"
        - "1.21.2"
        - "1.21.3"
        - "1.21.4"
        - "1.21.5"
        - "1.21.6"
        - "1.21.7"
        - "1.21.8"
        - "1.21.9"
        - "1.21.10"
        - "1.21.11"
        - "26.1"
        - "26.1.1"
        - "26.1.2"
        - "26.2"
        - "26.3"
        - "other (write it below)"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: QuantaVolt jar and loader version
      placeholder: "quantavolt-0.1.0+mc1.21.1-neoforge.jar, NeoForge 21.1.252"
    validations:
      required: true

  - type: input
    id: pipster
    attributes:
      label: Pipster version
      placeholder: "pipster-1.0.0+mc1.21.1-neoforge.jar"
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What happens?
      options:
        - It does not connect / interact at all
        - It interacts, but wrongly
        - Resources are lost or duplicated
        - Crash
        - Something else
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details and steps to reproduce
      description: What exactly did you do? Does it work with a vanilla block in the same place? Screenshots help.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`logs/latest.log` (drag and drop, or a paste link), and a crash report if there was one."
